[project]
name = "map-snapshot-api"
version = "1.0.0"
description = "Map snapshot API service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "playwright>=1.60.0",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1",
  "pytest>=8.3.0,<9",
  "ruff>=0.9.0,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
  "e2e: requires a running server, browser, AMap credentials, and network access",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["public"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"server/api/*.py" = ["B008"]
