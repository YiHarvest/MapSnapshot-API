{% extends "base_share.html" %}
{% block title %}City Map Snapshot{% endblock %}
{% block overlays %}
  <svg class="map-overlay" id="cityFill" width="100%" height="100%" aria-hidden="true"></svg>
  <svg class="map-overlay" id="highlightFill" width="100%" height="100%" aria-hidden="true"></svg>
  <svg class="map-overlay" id="cityBoundary" width="100%" height="100%" aria-hidden="true"></svg>
  <svg class="map-overlay" id="outsideMask" width="100%" height="100%" aria-hidden="true"></svg>
  <svg class="map-overlay" id="selectedHighlight" width="100%" height="100%" aria-hidden="true"></svg>
{% endblock %}
{% block page_script %}
<script>
    const {
      bindTouchTap,
      collectFeatureRings,
      escapeHtml,
      findFeatureAtPoint,
      findFeatureByAdcode,
      getFeatureDisplayName,
      getFeatureCenterFromGeometry,
      getDomEventLngLat,
      getLngLatPair,
      loadGeoJson,
      loadMapPlugins,
      normalizePolygonPaths,
      waitForMapFrame,
    } = window.MapSnapshotShare;
    const taskData = {{ task_data | tojson }};
    taskData.city = taskData.city && typeof taskData.city === "object" ? taskData.city : {};
    taskData.districts = Array.isArray(taskData.districts)
      ? taskData.districts.filter((district) => district && typeof district === "object")
      : [];
    const valueLabel = String(taskData.valueLabel || "状态");
    const sharePolyStyle = {{ share_poly_style | tojson }};
    const highlightPolyStyle = {
      strokeColor: "#ffffff",
      strokeOpacity: 0.95,
      strokeWeight: 1.2,
      fillColor: "#2f80ed",
      fillOpacity: 0.9,
      zIndex: 30,
    };
    const cityPolyStyle = {
      strokeColor: "#ffffff",
      strokeOpacity: 0.96,
      strokeWeight: 1.3,
      fillColor: "#cfd5dd",
      fillOpacity: 0,
      zIndex: 10,
    };
    const selectedStyle = {
      strokeColor: "#ffffff",
      strokeOpacity: 0.95,
      strokeWeight: 1.2,
      fillColor: "#f5c542",
      fillOpacity: 0.92,
      zIndex: 80,
    };

    const districtAdcodes = new Set(taskData.districts.map((district) => String(district.adcode || "")));
    const districtByAdcode = new Map(
      taskData.districts.map((district) => [String(district.adcode || ""), district])
    );
    let selectedDistrict = null;
    let selectedPolygonLayers = [];
    let handleDistrictHover = null;
    let hoverRequestId = 0;
    let interactionFallbackTimer = null;
    let renderScheduled = false;

    function renderFeature(map, feature, style) {
      return normalizePolygonPaths(feature.geometry).map((rings) => {
        const polygon = new AMap.Polygon({
          path: rings,
          clickable: true,
          ...style,
        });
        polygon.on("mousemove", (event) => {
          if (typeof handleDistrictHover === "function") {
            handleDistrictHover(event);
          }
        });
        polygon.setMap(map);
        return polygon;
      });
    }

    function renderFeatureCollection(map, geojson, styleForFeature, shouldRender = () => true) {
      if (!geojson || !Array.isArray(geojson.features)) {
        return [];
      }
      return geojson.features.flatMap((feature) => {
        if (!feature || typeof feature !== "object") {
          return [];
        }
        const properties = feature.properties || {};
        const adcode = String(properties.adcode || "");
        if (!adcode || adcode === "100000" || !shouldRender(feature, properties)) {
          return [];
        }
        return renderFeature(map, feature, styleForFeature(feature));
      });
    }

    function clearSelectedPolygons() {
      for (const polygon of selectedPolygonLayers) {
        polygon.setMap(null);
      }
      selectedPolygonLayers = [];
    }

    function hasSameSelectedDistrict(district) {
      if (!selectedDistrict && !district) {
        return true;
      }
      if (!selectedDistrict || !district) {
        return false;
      }
      return String(selectedDistrict.adcode || "") === String(district.adcode || "") &&
        String(selectedDistrict.level || "") === String(district.level || "");
    }

    function clearSelectedDistrict(map, cityBoundaries, highlightBoundaries) {
      hoverRequestId += 1;
      if (!selectedDistrict && !selectedPolygonLayers.length) {
        return;
      }
      selectedDistrict = null;
      clearSelectedPolygons();
      renderCityLayers(map, cityBoundaries, highlightBoundaries);
      renderSelectionCard(map);
    }

    function renderSelectedPolygons(map, rings) {
      clearSelectedPolygons();
      if (!rings || !Array.isArray(rings)) {
        return;
      }

      selectedPolygonLayers = rings.map((ring) => {
        const polygon = new AMap.Polygon({
          path: ring,
          clickable: true,
          ...selectedStyle,
        });
        polygon.on("mousemove", (event) => {
          if (typeof handleDistrictHover === "function") {
            handleDistrictHover(event);
          }
        });
        polygon.setMap(map);
        return polygon;
      });
    }

    function renderSelectionCard(map) {
      const layer = document.getElementById("selectionLayer");
      if (!layer) {
        return;
      }
      if (!selectedDistrict || !selectedDistrict.center) {
        layer.innerHTML = "";
        return;
      }

      const point = map.lngLatToContainer(selectedDistrict.center);
      const statusText = selectedDistrict.covered
        ? escapeHtml(valueLabel) + "：" + escapeHtml(selectedDistrict.value || "")
        : escapeHtml(valueLabel) + "：未覆盖";

      layer.innerHTML =
        '<div style="position:absolute;left:' + point.x.toFixed(1) + 'px;top:' + point.y.toFixed(1) + 'px;">' +
          '<div class="selected-card">' +
            '<div class="selected-card__name">' + escapeHtml(selectedDistrict.name || selectedDistrict.adcode || "") + '</div>' +
            '<div class="selected-card__status">' + statusText + '</div>' +
          '</div>' +
        '</div>';
    }

    function pointToPath(point, index) {
      return (index === 0 ? "M" : "L") + point.x.toFixed(1) + " " + point.y.toFixed(1);
    }

    function ringToSvgPath(map, ring) {
      const validPoints = ring
        .filter((coordinate) =>
          Array.isArray(coordinate) &&
          Number.isFinite(Number(coordinate[0])) &&
          Number.isFinite(Number(coordinate[1]))
        )
        .map((coordinate) => map.lngLatToContainer(coordinate))
        .filter((point) => Number.isFinite(point.x) && Number.isFinite(point.y));

      if (validPoints.length < 3) {
        return "";
      }

      return validPoints
        .map((point, index) => pointToPath(point, index))
        .join(" ") + " Z";
    }

    function renderCityLayers(map, cityBoundaries, highlightBoundaries) {
      const cityFill = document.getElementById("cityFill");
      const highlightFill = document.getElementById("highlightFill");
      const cityBoundary = document.getElementById("cityBoundary");
      const outsideMask = document.getElementById("outsideMask");
      const selectedHighlight = document.getElementById("selectedHighlight");

      if (!cityFill || !highlightFill || !cityBoundary || !outsideMask || !selectedHighlight || !cityBoundaries.length) {
        return;
      }

      const width = window.innerWidth;
      const height = window.innerHeight;
      const outerPath = "M0 0 H" + width + " V" + height + " H0 Z";

      const innerPaths = cityBoundaries
        .map((ring) => ringToSvgPath(map, ring))
        .filter(Boolean)
        .join(" ");

      const highlightPaths = highlightBoundaries
        .map((ring) => ringToSvgPath(map, ring))
        .filter(Boolean)
        .join(" ");

      for (const layer of [cityFill, highlightFill, cityBoundary, outsideMask, selectedHighlight]) {
        layer.setAttribute("viewBox", "0 0 " + width + " " + height);
      }

      cityFill.innerHTML =
        '<path d="' + innerPaths + '" fill="#d7dce2" fill-opacity="1"></path>';
      highlightFill.innerHTML = highlightPaths
        ? '<path d="' + highlightPaths + '" fill="#2f80ed" fill-opacity="0.9"></path>'
        : "";

      // 渲染选中的黄色高亮
      if (selectedDistrict && selectedDistrict.rings) {
        const selectedPaths = selectedDistrict.rings
          .map((ring) => ringToSvgPath(map, ring))
          .filter(Boolean)
          .join(" ");
        selectedHighlight.innerHTML = selectedPaths
          ? '<path d="' + selectedPaths + '" fill="#f5c542" fill-opacity="0.92" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.95"></path>'
          : "";
      } else {
        selectedHighlight.innerHTML = "";
      }

      const boundaryPaths = innerPaths.split(" Z").filter(Boolean).map((path) =>
        '<path d="' + path + ' Z" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="2.2" stroke-linejoin="round"></path>'
      ).join("");

      cityBoundary.innerHTML = boundaryPaths;
      outsideMask.innerHTML =
        '<path d="' + outerPath + " " + innerPaths + '" fill="#ffffff" fill-opacity="0.98" fill-rule="evenodd"></path>';
    }

    function getSingleDistrictZoom(district) {
      return {{ single_region_zoom | tojson }}[district.level] ?? {{ single_region_default_zoom }};
    }

    function getCityFitPadding() {
      return [85, 85, 85, 85];
    }

    function createDistrictFromFeature(feature) {
      const properties = feature.properties || {};
      const adcode = String(properties.adcode || "");
      const matchedDistrict = districtByAdcode.get(adcode) || {};
      const center = properties.centroid || properties.center || matchedDistrict.center || null;
      const isCovered = districtAdcodes.has(adcode);
      return {
        name: getFeatureDisplayName(properties, adcode),
        adcode,
        level: String(properties.level || ""),
        value: String(matchedDistrict.value || ""),
        center,
        rings: normalizePolygonPaths(feature.geometry),
        covered: isCovered,
      };
    }

    function getCityGeoJsonPath(city) {
      const adcode = String(city && city.adcode || "");
      if (!adcode) {
        return "";
      }
      return "/geojson/city/" + adcode + ".json";
    }

    async function resolveHoveredDistrict(map, cityGeoJson, lnglat) {
      const point = getLngLatPair(lnglat);
      if (!point) {
        return null;
      }

      const districtFeature = findFeatureAtPoint(cityGeoJson, point, "district");
      return districtFeature ? createDistrictFromFeature(districtFeature) : null;
    }

    function markMapInteracting(onFallback) {
      document.body.classList.add("is-map-interacting");
      if (interactionFallbackTimer) {
        window.clearTimeout(interactionFallbackTimer);
      }
      interactionFallbackTimer = window.setTimeout(() => {
        interactionFallbackTimer = null;
        if (typeof onFallback === "function") {
          onFallback();
        } else {
          document.body.classList.remove("is-map-interacting");
        }
      }, 900);
    }

    async function renderDynamicLayers(map, cityBoundaries, highlightBoundaries, options = {}) {
      renderCityLayers(map, cityBoundaries, highlightBoundaries);
      renderSelectionCard(map);
      if (interactionFallbackTimer) {
        window.clearTimeout(interactionFallbackTimer);
        interactionFallbackTimer = null;
      }
      document.body.classList.remove("is-map-interacting");
      if (options.finishBoot) {
        document.body.classList.remove("is-map-booting");
      }
    }

    function scheduleDynamicLayers(map, cityBoundaries, highlightBoundaries, options = {}) {
      if (renderScheduled) {
        return;
      }
      renderScheduled = true;
      window.requestAnimationFrame(() => {
        renderScheduled = false;
        renderDynamicLayers(map, cityBoundaries, highlightBoundaries, options);
      });
    }

    async function init() {
      if (!window.AMap) {
        throw new Error("AMap JS API not loaded");
      }
      if (!taskData.city || !taskData.city.adcode) {
        throw new Error("city data not ready");
      }
      if (!taskData.districts.length) {
        throw new Error("district data not ready");
      }

      window.setTimeout(() => {
        window.__MAP_READY__ = true;
      }, {{ map_ready_fallback_timeout_ms }});

      document.getElementById("summary").innerHTML =
        '<div class="district-item"><strong>范围：</strong>' + escapeHtml(taskData.city.name || taskData.city.adcode) + '</div>' +
        taskData.districts.map((district, index) =>
          '<div class="district-item"><strong>标记区/县' + (index + 1) + '：</strong>' +
          escapeHtml(district.name || district.adcode) +
          '&nbsp;&nbsp;&nbsp;&nbsp;<strong>' + escapeHtml(valueLabel) + '：</strong> ' +
          escapeHtml(district.value) +
          '</div>'
        ).join("");

      const map = new AMap.Map("map", {
        viewMode: "2D",
        zoom: {{ share_map_zoom }},
        zooms: [{{ share_map_zooms_0 }}, {{ share_map_zooms_1 }}],
        resizeEnable: true,
        mapStyle: "amap://styles/whitesmoke",
      });

      await loadMapPlugins({{ map_ready_fallback_timeout_ms }});
      map.addControl(new AMap.Scale({ position: "LB" }));

      // 加载市级 GeoJSON（包含区县要素）
      const cityGeoJsonPath = getCityGeoJsonPath(taskData.city);
      const cityGeoJson = await loadGeoJson(cityGeoJsonPath);
      const cityBoundaries = renderFeatureCollection(
        map,
        cityGeoJson,
        () => cityPolyStyle
      );

      // 从 GeoJSON 获取当前市的边界（用于 SVG 遮罩）
      const cityMaskBoundaries =
        cityGeoJson && Array.isArray(cityGeoJson.features)
          ? cityGeoJson.features.flatMap((feature) => normalizePolygonPaths(feature.geometry))
          : [];

      // 从 GeoJSON 获取高亮区县的边界（确保精确匹配）
      const highlightBoundaries =
        cityGeoJson && Array.isArray(cityGeoJson.features)
          ? collectFeatureRings(
              cityGeoJson,
              (feature, properties) => districtAdcodes.has(String(properties.adcode || ""))
            )
          : [];

      const districtBoundaries = renderFeatureCollection(
        map,
        cityGeoJson,
        () => highlightPolyStyle,
        (feature, properties) => districtAdcodes.has(String(properties.adcode || ""))
      );

      for (const district of taskData.districts) {
        if (district.center) {
          continue;
        }
        const feature = findFeatureByAdcode(cityGeoJson, district.adcode);
        const center = feature ? getFeatureCenterFromGeometry(feature) : null;
        if (center) {
          district.center = center;
        }
      }

      const markers = taskData.districts.filter((district) => district.center).map((district) => {
        const marker = new AMap.Marker({
          position: district.center,
          offset: new AMap.Pixel(0, 0),
          content: '<div style="width:1px;height:1px;"></div>',
          title: district.name || district.adcode,
          zIndex: 1,
        });
        marker.setMap(map);
        return {
          marker,
          position: district.center,
          value: district.value,
        };
      });

      if (cityBoundaries.length) {
        const padding = getCityFitPadding();
        map.setFitView(
          [
            ...cityBoundaries,
            ...markers.map((item) => item.marker),
          ],
          false,
          padding
        );
        
        const selectDistrictAt = async (lnglat, options = {}) => {
          if (!lnglat) {
            return;
          }
          const requestId = ++hoverRequestId;
          const district = await resolveHoveredDistrict(map, cityGeoJson, lnglat);
          if (requestId !== hoverRequestId) {
            return;
          }
          if (!district) {
            if (options.clearOnMiss !== false) {
              clearSelectedDistrict(map, cityMaskBoundaries, highlightBoundaries);
            }
            return;
          }
          if (hasSameSelectedDistrict(district)) {
            return;
          }
          selectedDistrict = district;
          renderSelectedPolygons(map, district.rings);
          renderCityLayers(map, cityMaskBoundaries, highlightBoundaries);
          renderSelectionCard(map);
        };

        // 设置悬停事件处理
        handleDistrictHover = async (event) => {
          const lnglat = event && event.lnglat ? event.lnglat : getDomEventLngLat(map, event);
          if (!lnglat) {
            clearSelectedDistrict(map, cityMaskBoundaries, highlightBoundaries);
            return;
          }
          await selectDistrictAt(lnglat);
        };
        const handleDistrictTap = async (event) => {
          const lnglat = event && event.lnglat ? event.lnglat : getDomEventLngLat(map, event);
          if (!lnglat) {
            return;
          }
          await selectDistrictAt(lnglat);
        };

        // 监听地图悬停事件
        map.on("mousemove", handleDistrictHover);
        
        // 监听容器悬停事件
        map.getContainer().addEventListener("mousemove", (event) => {
          if (typeof handleDistrictHover !== "function") {
            return;
          }
          const lnglat = getDomEventLngLat(map, event);
          if (!lnglat) {
            return;
          }
          handleDistrictHover({ lnglat });
        }, true);
        map.getContainer().addEventListener("mouseleave", () => {
          clearSelectedDistrict(map, cityMaskBoundaries, highlightBoundaries);
        });
        map.on("click", handleDistrictTap);
        bindTouchTap(map.getContainer(), handleDistrictTap);

        window.addEventListener("resize", () => {
          markMapInteracting(() => {
            scheduleDynamicLayers(map, cityMaskBoundaries, highlightBoundaries);
          });
          scheduleDynamicLayers(map, cityMaskBoundaries, highlightBoundaries);
        });

        await waitForMapFrame();
        
        window.setTimeout(() => {
          renderDynamicLayers(map, cityMaskBoundaries, highlightBoundaries, { finishBoot: true });
        }, 260);
        
        map.on("mapmove", () => {
          markMapInteracting(() => {
            scheduleDynamicLayers(map, cityMaskBoundaries, highlightBoundaries);
          });
          scheduleDynamicLayers(map, cityMaskBoundaries, highlightBoundaries);
        });
        
        map.on("zoomchange", () => {
          markMapInteracting(() => {
            scheduleDynamicLayers(map, cityMaskBoundaries, highlightBoundaries);
          });
          scheduleDynamicLayers(map, cityMaskBoundaries, highlightBoundaries);
        });
      } else if (markers.length === 1) {
        map.setZoomAndCenter(getSingleDistrictZoom(taskData.districts[0]), markers[0].marker.getPosition());
      } else {
        map.setFitView(
          [
            ...districtBoundaries,
            ...markers.map((item) => item.marker),
          ],
          false,
          [{{ multi_fitview_padding }}],
          10
        );
      }

      map.on("complete", () => {
        window.setTimeout(() => {
          renderDynamicLayers(map, cityMaskBoundaries, highlightBoundaries);
          window.__MAP_READY__ = true;
        }, {{ map_complete_delay_ms }});
      });

    }

    init().catch((error) => {
      console.error("City map render failed", error);
      document.body.innerHTML = '<pre style="padding:16px;color:#b00020;">' + escapeHtml(error.message) + '</pre>';
      window.__MAP_READY__ = true;
    });
  </script>
{% endblock %}
