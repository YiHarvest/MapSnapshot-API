<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Province Map Snapshot</title>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    html, body { overscroll-behavior: none; }
    #map { background: #ffffff !important; }
    #map { touch-action: none; }
    body { background: #f4f6f8; font-family: "Noto Sans CJK SC", sans-serif; }
    .amap-layer-tile {
      display: none !important;
    }
    /* 高德地图控件 z-index */
    .amap-copyright,
    .amap-logo,
    .amap-maptype,
    [class*="amap-copyright"],
    [class*="amap-logo"],
    a[href*="amap.com"],
    a[href*="autonavi.com"] {
      display: none !important;
      z-index: 5 !important;
    }
    .amap-controls,
    .amap-scale-textcontrol,
    .amap-scale,
    [class*="amap-scale"] {
      z-index: 150 !important;
    }
    body.is-map-booting #map {
      opacity: 0;
    }
    body.is-map-booting #selectionLayer {
      opacity: 0;
    }
    #selectionLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1400;
    }
    body.is-map-interacting #selectionLayer {
      opacity: 0;
    }
    .selected-card {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      min-width: 156px;
      max-width: 240px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.98);
      color: #111827;
      font-size: 15px;
      white-space: normal;
      word-break: normal;
      overflow-wrap: anywhere;
      line-height: 1.35;
      text-align: left;
      box-shadow: 0 10px 24px rgba(31, 45, 61, 0.18);
      transform: translate(-50%, -110%);
    }
    .amap-marker-content {
      width: max-content !important;
    }
    .selected-card::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 13px;
      height: 13px;
      border-right: 1px solid rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.98);
      transform: translateX(-50%) rotate(45deg);
      border-radius: 2px;
    }
    .selected-card__name {
      font-size: 16px;
      font-weight: 800;
      color: #374151;
      line-height: 1.2;
    }
    .selected-card__status {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #6b7280;
      line-height: 1.2;
    }
    #provinceFill,
    #highlightFill,
    #provinceBoundary,
    #outsideMask,
    #selectedHighlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .snapshot-summary {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1001;
      max-width: min(520px, calc(100vw - 36px));
      padding: 12px 16px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 6px 18px rgba(31, 45, 61, 0.1);
      color: #1f2937;
      font-size: 15px;
      line-height: 1.55;
    }
    .snapshot-summary strong {
      font-weight: 800;
      color: #111827;
    }
    .snapshot-summary .region-item {
      margin-bottom: 12px;
    }
    .snapshot-summary .region-item:last-child {
      margin-bottom: 0;
    }
    @media (max-width: 640px) {
      .snapshot-summary {
        top: 8px;
        left: 8px;
        max-width: calc(100vw - 16px);
        max-height: min(30vh, 180px);
        box-sizing: border-box;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 7px 9px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.32;
        scrollbar-width: thin;
      }
      .snapshot-summary .region-item {
        margin-bottom: 6px;
        word-break: break-word;
      }
      .selected-card {
        min-width: 116px;
        max-width: min(220px, calc(100vw - 32px));
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 13px;
      }
      .selected-card__name {
        font-size: 14px;
      }
      .selected-card__status {
        margin-top: 6px;
        font-size: 12px;
      }
    }
  </style>
  <script>
    window.__MAP_READY__ = false;
    {{ security_config_js | safe }}
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key={{ amap_key }}"></script>
</head>
<body class="is-map-booting is-map-interacting">
  <div class="snapshot-summary" id="summary"></div>
  <div id="map"></div>
  <svg id="provinceFill" width="100%" height="100%" aria-hidden="true"></svg>
  <svg id="highlightFill" width="100%" height="100%" aria-hidden="true"></svg>
  <svg id="provinceBoundary" width="100%" height="100%" aria-hidden="true"></svg>
  <svg id="outsideMask" width="100%" height="100%" aria-hidden="true"></svg>
  <svg id="selectedHighlight" width="100%" height="100%" aria-hidden="true"></svg>
  <div id="selectionLayer" aria-hidden="true"></div>
  <script>
    const taskData = {{ task_data | tojson }};
    taskData.province = taskData.province && typeof taskData.province === "object" ? taskData.province : {};
    taskData.regions = Array.isArray(taskData.regions)
      ? taskData.regions.filter((region) => region && typeof region === "object")
      : [];
    const valueLabel = String(taskData.valueLabel || "状态");
    const sharePolyStyle = {{ share_poly_style | tojson }};
    const highlightPolyStyle = {
      strokeColor: "#ffffff",
      strokeOpacity: 0.95,
      strokeWeight: 1.2,
      fillColor: "#2f80ed",
      fillOpacity: 0.9,
      zIndex: 30,
    };
    const provincePolyStyle = {
      strokeColor: "#ffffff",
      strokeOpacity: 0.96,
      strokeWeight: 1.3,
      fillColor: "#cfd5dd",
      fillOpacity: 0,
      zIndex: 10,
    };
    const detailLineStyle = {
      strokeColor: "#ffffff",
      strokeOpacity: 0.9,
      strokeWeight: 1,
      fillColor: "#dfe3e8",
      fillOpacity: 0,
      zIndex: 20,
    };
    const selectedStyle = {
      strokeColor: "#ffffff",
      strokeOpacity: 0.95,
      strokeWeight: 1.2,
      fillColor: "#f5c542",
      fillOpacity: 0.92,
      zIndex: 80,
    };

    const regionAdcodes = new Set(taskData.regions.map((region) => String(region.adcode || "")));
    const regionByAdcode = new Map(
      taskData.regions.map((region) => [String(region.adcode || ""), region])
    );
    const loadedGeoJson = new Map();
    const renderedDetailLayers = new Map();

    let selectedRegion = null;
    let selectedPolygonLayers = [];
    let handleRegionHover = null;
    let tapCandidate = null;
    let hoverRequestId = 0;
    let interactionFallbackTimer = null;
    let renderScheduled = false;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function loadMapPlugins() {
      return new Promise((resolve, reject) => {
        let settled = false;
        const timeout = window.setTimeout(() => {
          if (settled) {
            return;
          }
          settled = true;
          if (AMap.Scale) {
            console.warn("AMap plugin callback timeout, using detected plugins");
            resolve();
            return;
          }
          reject(new Error("AMap plugin load timeout"));
        }, {{ map_ready_fallback_timeout_ms }});

        AMap.plugin(["AMap.Scale"], () => {
          if (settled) {
            return;
          }
          settled = true;
          window.clearTimeout(timeout);
          if (!AMap.Scale) {
            reject(new Error("AMap.Scale plugin load failed"));
            return;
          }
          resolve();
        });
      });
    }

    function findFeatureByAdcode(geojson, adcode) {
      if (!geojson || !Array.isArray(geojson.features) || !adcode) {
        return null;
      }
      const normalizedAdcode = String(adcode || "");
      return (
        geojson.features.find((feature) => {
          const properties = feature.properties || {};
          return String(properties.adcode || "") === normalizedAdcode;
        }) || null
      );
    }

    function getFeatureCenterFromGeometry(feature) {
      if (!feature || !feature.geometry) {
        return null;
      }
      const rings = normalizePolygonPaths(feature.geometry);
      if (!rings.length) {
        return null;
      }
      let minLng = Number.POSITIVE_INFINITY;
      let minLat = Number.POSITIVE_INFINITY;
      let maxLng = Number.NEGATIVE_INFINITY;
      let maxLat = Number.NEGATIVE_INFINITY;
      for (const ring of rings) {
        for (const point of ring) {
          const lng = Number(point?.[0]);
          const lat = Number(point?.[1]);
          if (!Number.isFinite(lng) || !Number.isFinite(lat)) {
            continue;
          }
          minLng = Math.min(minLng, lng);
          minLat = Math.min(minLat, lat);
          maxLng = Math.max(maxLng, lng);
          maxLat = Math.max(maxLat, lat);
        }
      }
      if (!Number.isFinite(minLng) || !Number.isFinite(minLat)) {
        return null;
      }
      return [(minLng + maxLng) / 2, (minLat + maxLat) / 2];
    }

    function renderFeature(map, feature, style) {
      return normalizePolygonPaths(feature.geometry).map((rings) => {
        const polygon = new AMap.Polygon({
          path: rings,
          clickable: true,
          ...style,
        });
        polygon.on("mousemove", (event) => {
          if (typeof handleRegionHover === "function") {
            handleRegionHover(event);
          }
        });
        polygon.setMap(map);
        return polygon;
      });
    }

    function renderFeatureCollection(map, geojson, styleForFeature, shouldRender = () => true) {
      if (!geojson || !Array.isArray(geojson.features)) {
        return [];
      }
      return geojson.features.flatMap((feature) => {
        if (!feature || typeof feature !== "object") {
          return [];
        }
        const properties = feature.properties || {};
        const adcode = String(properties.adcode || "");
        if (!adcode || adcode === "100000" || !shouldRender(feature, properties)) {
          return [];
        }
        return renderFeature(map, feature, styleForFeature(feature));
      });
    }

    function normalizePolygonPaths(geometry) {
      if (!geometry || !Array.isArray(geometry.coordinates)) {
        return [];
      }
      if (geometry.type === "Polygon") {
        return geometry.coordinates;
      }
      if (geometry.type === "MultiPolygon") {
        return geometry.coordinates.flat();
      }
      return [];
    }

    function normalizePolygonParts(geometry) {
      if (!geometry || !Array.isArray(geometry.coordinates)) {
        return [];
      }
      if (geometry.type === "Polygon") {
        return [geometry.coordinates];
      }
      if (geometry.type === "MultiPolygon") {
        return geometry.coordinates;
      }
      return [];
    }

    function clearSelectedPolygons() {
      for (const polygon of selectedPolygonLayers) {
        polygon.setMap(null);
      }
      selectedPolygonLayers = [];
    }

    function hasSameSelectedRegion(region) {
      if (!selectedRegion && !region) {
        return true;
      }
      if (!selectedRegion || !region) {
        return false;
      }
      return String(selectedRegion.adcode || "") === String(region.adcode || "") &&
        String(selectedRegion.level || "") === String(region.level || "");
    }

    function clearSelectedRegion(map, provinceBoundaries, highlightBoundaries, cityBoundaries) {
      hoverRequestId += 1;
      if (!selectedRegion && !selectedPolygonLayers.length) {
        return;
      }
      selectedRegion = null;
      clearSelectedPolygons();
      renderProvinceLayers(map, provinceBoundaries, highlightBoundaries, cityBoundaries);
      renderSelectionCard(map);
    }

    function renderSelectedPolygons(map, rings) {
      clearSelectedPolygons();
      if (!rings || !Array.isArray(rings)) {
        return;
      }

      selectedPolygonLayers = rings.map((ring) => {
        const polygon = new AMap.Polygon({
          path: ring,
          clickable: true,
          ...selectedStyle,
        });
        polygon.on("mousemove", (event) => {
          if (typeof handleRegionHover === "function") {
            handleRegionHover(event);
          }
        });
        polygon.setMap(map);
        return polygon;
      });
    }

    function renderSelectionCard(map) {
      const layer = document.getElementById("selectionLayer");
      if (!layer) {
        return;
      }
      if (!selectedRegion || !selectedRegion.center) {
        layer.innerHTML = "";
        return;
      }

      const point = map.lngLatToContainer(selectedRegion.center);
      const statusText = selectedRegion.covered
        ? escapeHtml(valueLabel) + "：" + escapeHtml(selectedRegion.value || "")
        : escapeHtml(valueLabel) + "：未覆盖";

      layer.innerHTML =
        '<div style="position:absolute;left:' + point.x.toFixed(1) + 'px;top:' + point.y.toFixed(1) + 'px;">' +
          '<div class="selected-card">' +
            '<div class="selected-card__name">' + escapeHtml(selectedRegion.name || selectedRegion.adcode || "") + '</div>' +
            '<div class="selected-card__status">' + statusText + '</div>' +
          '</div>' +
        '</div>';
    }

    function pointToPath(point, index) {
      return (index === 0 ? "M" : "L") + point.x.toFixed(1) + " " + point.y.toFixed(1);
    }

    function ringToSvgPath(map, ring) {
      const validPoints = ring
        .filter((coordinate) =>
          Array.isArray(coordinate) &&
          Number.isFinite(Number(coordinate[0])) &&
          Number.isFinite(Number(coordinate[1]))
        )
        .map((coordinate) => map.lngLatToContainer(coordinate))
        .filter((point) => Number.isFinite(point.x) && Number.isFinite(point.y));

      if (validPoints.length < 3) {
        return "";
      }

      return validPoints
        .map((point, index) => pointToPath(point, index))
        .join(" ") + " Z";
    }

    function renderProvinceLayers(map, provinceBoundaries, highlightBoundaries, cityBoundaries) {
      const provinceFill = document.getElementById("provinceFill");
      const highlightFill = document.getElementById("highlightFill");
      const provinceBoundary = document.getElementById("provinceBoundary");
      const outsideMask = document.getElementById("outsideMask");
      const selectedHighlight = document.getElementById("selectedHighlight");

      if (!provinceFill || !highlightFill || !provinceBoundary || !outsideMask || !selectedHighlight || !provinceBoundaries.length) {
        return;
      }

      const width = window.innerWidth;
      const height = window.innerHeight;
      const outerPath = "M0 0 H" + width + " V" + height + " H0 Z";

      const innerPaths = provinceBoundaries
        .map((ring) => ringToSvgPath(map, ring))
        .filter(Boolean)
        .join(" ");

      const highlightPaths = highlightBoundaries
        .map((ring) => ringToSvgPath(map, ring))
        .filter(Boolean)
        .join(" ");

      const cityPaths = cityBoundaries
        .map((ring) => ringToSvgPath(map, ring))
        .filter(Boolean)
        .join(" ");

      for (const layer of [provinceFill, highlightFill, provinceBoundary, outsideMask, selectedHighlight]) {
        layer.setAttribute("viewBox", "0 0 " + width + " " + height);
      }

      provinceFill.innerHTML =
        '<path d="' + innerPaths + '" fill="#d7dce2" fill-opacity="1"></path>';
      highlightFill.innerHTML = highlightPaths
        ? '<path d="' + highlightPaths + '" fill="#2f80ed" fill-opacity="0.9"></path>'
        : "";

      // 渲染选中的黄色高亮
      if (selectedRegion && selectedRegion.rings) {
        const selectedPaths = selectedRegion.rings
          .map((ring) => ringToSvgPath(map, ring))
          .filter(Boolean)
          .join(" ");
        selectedHighlight.innerHTML = selectedPaths
          ? '<path d="' + selectedPaths + '" fill="#f5c542" fill-opacity="0.92" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.95"></path>'
          : "";
      } else {
        selectedHighlight.innerHTML = "";
      }

      const boundaryPaths = innerPaths.split(" Z").filter(Boolean).map((path) =>
        '<path d="' + path + ' Z" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="2.2" stroke-linejoin="round"></path>'
      ).join("");

      const cityBoundaryPaths = cityPaths.split(" Z").filter(Boolean).map((path) =>
        '<path d="' + path + ' Z" fill="none" stroke="#ffffff" stroke-opacity="0.96" stroke-width="1.6" stroke-linejoin="round"></path>'
      ).join("");

      provinceBoundary.innerHTML = boundaryPaths + cityBoundaryPaths;
      outsideMask.innerHTML =
        '<path d="' + outerPath + " " + innerPaths + '" fill="#ffffff" fill-opacity="0.98" fill-rule="evenodd"></path>';
    }

    function getSingleRegionZoom(region) {
      return {{ single_region_zoom | tojson }}[region.level] ?? {{ single_region_default_zoom }};
    }

    function getProvinceFitPadding(provinceData) {
      if (provinceData.level === "province") {
        return [60, 60, 60, 60];
      }
      if (provinceData.level === "city") {
        return [85, 85, 85, 85];
      }
      return [{{ multi_fitview_padding }}];
    }

    async function loadGeoJson(path) {
      if (!path) {
        return null;
      }
      if (loadedGeoJson.has(path)) {
        return loadedGeoJson.get(path);
      }
      try {
        const response = await fetch(path);
        if (!response.ok) {
          loadedGeoJson.set(path, null);
          return null;
        }
        const geojson = await response.json();
        loadedGeoJson.set(path, geojson);
        return geojson;
      } catch (e) {
        console.error("Failed to load GeoJSON", path, e);
        loadedGeoJson.set(path, null);
        return null;
      }
    }

    async function loadGeoJsonEntries(paths) {
      const uniquePaths = Array.from(new Set(paths.filter(Boolean)));
      const entries = await Promise.all(uniquePaths.map(async (path) => [path, await loadGeoJson(path)]));
      return new Map(entries);
    }

    function collectFeatureRings(geojson, shouldCollect) {
      if (!geojson || !Array.isArray(geojson.features)) {
        return [];
      }
      return geojson.features.flatMap((feature) => {
        if (!feature || typeof feature !== "object") {
          return [];
        }
        const properties = feature.properties || {};
        return shouldCollect(feature, properties) ? normalizePolygonPaths(feature.geometry) : [];
      });
    }

    function pointInRing(point, ring) {
      if (!Array.isArray(ring) || ring.length < 3) {
        return false;
      }

      const [lng, lat] = point;
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = Number(ring[i][0]);
        const yi = Number(ring[i][1]);
        const xj = Number(ring[j][0]);
        const yj = Number(ring[j][1]);
        if (![xi, yi, xj, yj].every(Number.isFinite)) {
          continue;
        }
        const intersects = ((yi > lat) !== (yj > lat)) &&
          (lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi);
        if (intersects) {
          inside = !inside;
        }
      }
      return inside;
    }

    function featureContainsPoint(feature, point) {
      return normalizePolygonParts(feature.geometry).some((rings) => {
        if (!Array.isArray(rings) || !rings.length || !pointInRing(point, rings[0])) {
          return false;
        }
        return !rings.slice(1).some((hole) => pointInRing(point, hole));
      });
    }

    function findFeatureAtPoint(geojson, point, level) {
      if (!geojson || !Array.isArray(geojson.features) || !point) {
        return null;
      }
      return geojson.features.find((feature) => {
        const properties = feature.properties || {};
        const adcode = String(properties.adcode || "");
        return adcode && adcode !== "100000" &&
          (!level || String(properties.level || "") === level) &&
          featureContainsPoint(feature, point);
      }) || null;
    }

    function getFeatureDisplayName(properties, fallbackAdcode) {
      return String(
        properties.name ||
        properties.adname ||
        properties.fullname ||
        properties.cityname ||
        fallbackAdcode ||
        ""
      ).trim();
    }

    function createRegionFromFeature(feature) {
      const properties = feature.properties || {};
      const adcode = String(properties.adcode || "");
      const matchedRegion = regionByAdcode.get(adcode) || {};
      const center = properties.centroid || properties.center || matchedRegion.center || null;
      const isCovered = regionAdcodes.has(adcode);
      return {
        name: getFeatureDisplayName(properties, adcode),
        adcode,
        level: String(properties.level || ""),
        value: String(matchedRegion.value || ""),
        center,
        rings: normalizePolygonPaths(feature.geometry),
        covered: isCovered,
      };
    }

    function getLngLatPair(lnglat) {
      if (!lnglat) {
        return null;
      }
      const lng = Number(typeof lnglat.getLng === "function" ? lnglat.getLng() : lnglat.lng ?? lnglat[0]);
      const lat = Number(typeof lnglat.getLat === "function" ? lnglat.getLat() : lnglat.lat ?? lnglat[1]);
      return Number.isFinite(lng) && Number.isFinite(lat) ? [lng, lat] : null;
    }

    function getCityAdcode(adcode) {
      return String(adcode || "").slice(0, 4) + "00";
    }

    function getProvinceGeoJsonPath(provinceData) {
      const adcode = String(provinceData && provinceData.adcode || "");
      if (!adcode) {
        return "";
      }
      if (provinceData.level === "province") {
        return "/geojson/province/" + adcode + ".json";
      }
      if (provinceData.level === "city") {
        return "/geojson/city/" + adcode + ".json";
      }
      return "";
    }

    function getProvinceDetailLayerSpecs(provinceData) {
      if (provinceData.level !== "province") {
        return [];
      }
      const specs = new Map();
      for (const region of taskData.regions) {
        const adcode = String(region.adcode || "");
        if (!adcode || adcode.endsWith("0000")) {
          continue;
        }
        const cityAdcode = adcode.endsWith("00") ? adcode : getCityAdcode(adcode);
        specs.set("city:" + cityAdcode, {
          path: "/geojson/city/" + cityAdcode + ".json",
          minZoom: 7.6,
        });
      }
      return Array.from(specs.values());
    }

    function getRegionHoverThreshold(level) {
      if (level === "district") {
        return 9.2;
      }
      if (level === "city") {
        return 7.4;
      }
      return 0;
    }

    function getDomEventLngLat(map, event) {
      const container = map && typeof map.getContainer === "function" ? map.getContainer() : null;
      if (!container || !event || typeof map.containerToLngLat !== "function") {
        return null;
      }
      const rect = container.getBoundingClientRect();
      const x = Number(event.clientX) - rect.left;
      const y = Number(event.clientY) - rect.top;
      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        return null;
      }
      return map.containerToLngLat(new AMap.Pixel(x, y));
    }

    function rememberTapCandidate(event) {
      if (!event || event.pointerType === "mouse" || event.isPrimary === false) {
        return;
      }
      tapCandidate = {
        id: event.pointerId,
        x: Number(event.clientX),
        y: Number(event.clientY),
        time: Date.now(),
      };
    }

    function consumeTapCandidate(event) {
      if (!tapCandidate || !event || event.pointerId !== tapCandidate.id) {
        tapCandidate = null;
        return false;
      }
      const dx = Number(event.clientX) - tapCandidate.x;
      const dy = Number(event.clientY) - tapCandidate.y;
      const elapsed = Date.now() - tapCandidate.time;
      tapCandidate = null;
      return Math.hypot(dx, dy) <= 12 && elapsed <= 800;
    }

    function bindTouchTap(container, onTap) {
      if (!container || typeof window.PointerEvent === "undefined") {
        return;
      }
      container.addEventListener("pointerdown", rememberTapCandidate, { passive: true });
      container.addEventListener("pointercancel", () => {
        tapCandidate = null;
      }, { passive: true });
      container.addEventListener("pointerup", (event) => {
        if (consumeTapCandidate(event)) {
          onTap(event);
        }
      }, { passive: true });
    }

    async function resolveHoveredRegion(map, provinceGeoJson, lnglat) {
      const point = getLngLatPair(lnglat);
      if (!point) {
        return null;
      }

      if (taskData.province.level === "city") {
        const districtFeature = findFeatureAtPoint(provinceGeoJson, point, "district");
        return districtFeature ? createRegionFromFeature(districtFeature) : null;
      }

      const cityFeature = findFeatureAtPoint(provinceGeoJson, point, "city");
      if (!cityFeature) {
        return null;
      }
      if (map.getZoom() < getRegionHoverThreshold("district")) {
        return createRegionFromFeature(cityFeature);
      }

      const cityAdcode = String((cityFeature.properties || {}).adcode || "");
      const cityGeoJson = await loadGeoJson("/geojson/city/" + cityAdcode + ".json");
      const districtFeature = findFeatureAtPoint(cityGeoJson, point, "district");
      return createRegionFromFeature(districtFeature || cityFeature);
    }

    function markMapInteracting(onFallback) {
      document.body.classList.add("is-map-interacting");
      if (interactionFallbackTimer) {
        window.clearTimeout(interactionFallbackTimer);
      }
      interactionFallbackTimer = window.setTimeout(() => {
        interactionFallbackTimer = null;
        if (typeof onFallback === "function") {
          onFallback();
        } else {
          document.body.classList.remove("is-map-interacting");
        }
      }, 900);
    }

    async function ensureDetailLayer(map, spec) {
      if (renderedDetailLayers.has(spec.path)) {
        return renderedDetailLayers.get(spec.path);
      }
      const geojson = await loadGeoJson(spec.path);
      const polygons = renderFeatureCollection(map, geojson, () => detailLineStyle);
      for (const polygon of polygons) {
        polygon.hide();
      }
      renderedDetailLayers.set(spec.path, polygons);
      return polygons;
    }

    async function updateDetailLayers(map, specs) {
      const zoom = map.getZoom();
      for (const spec of specs) {
        const renderedPolygons = renderedDetailLayers.get(spec.path);
        if (zoom < spec.minZoom) {
          if (renderedPolygons) {
            for (const polygon of renderedPolygons) {
              polygon.hide();
            }
          }
          continue;
        }
        const polygons = await ensureDetailLayer(map, spec);
        for (const polygon of polygons) {
          polygon.show();
        }
      }
    }

    async function renderDynamicLayers(map, provinceBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs, options = {}) {
      await updateDetailLayers(map, detailLayerSpecs);
      renderProvinceLayers(map, provinceBoundaries, highlightBoundaries, cityBoundaries);
      renderSelectionCard(map);
      if (interactionFallbackTimer) {
        window.clearTimeout(interactionFallbackTimer);
        interactionFallbackTimer = null;
      }
      document.body.classList.remove("is-map-interacting");
      if (options.finishBoot) {
        document.body.classList.remove("is-map-booting");
      }
    }

    function scheduleDynamicLayers(map, provinceBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs, options = {}) {
      if (renderScheduled) {
        return;
      }
      renderScheduled = true;
      window.requestAnimationFrame(() => {
        renderScheduled = false;
        renderDynamicLayers(map, provinceBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs, options);
      });
    }

    function waitForMapFrame() {
      return new Promise((resolve) => {
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(resolve);
        });
      });
    }

    async function init() {
      if (!window.AMap) {
        throw new Error("AMap JS API not loaded");
      }
      if (!taskData.province || !taskData.province.adcode) {
        throw new Error("province data not ready");
      }
      if (!taskData.regions.length) {
        throw new Error("region data not ready");
      }

      window.setTimeout(() => {
        window.__MAP_READY__ = true;
      }, {{ map_ready_fallback_timeout_ms }});

      document.getElementById("summary").innerHTML =
        '<div class="region-item"><strong>范围：</strong>' + escapeHtml(taskData.province.name || taskData.province.adcode) + '</div>' +
        taskData.regions.map((region, index) =>
          '<div class="region-item"><strong>标记区域' + (index + 1) + '：</strong>' +
          escapeHtml(region.name || region.adcode) +
          '&nbsp;&nbsp;&nbsp;&nbsp;<strong>' + escapeHtml(valueLabel) + '：</strong> ' +
          escapeHtml(region.value) +
          '</div>'
        ).join("");

      const map = new AMap.Map("map", {
        viewMode: "2D",
        zoom: {{ share_map_zoom }},
        zooms: [{{ share_map_zooms_0 }}, {{ share_map_zooms_1 }}],
        resizeEnable: true,
        mapStyle: "amap://styles/whitesmoke",
      });

      await loadMapPlugins();
      map.addControl(new AMap.Scale({ position: "LB" }));

      // 根据 province 层级加载基础 GeoJSON：
      // 省级范围加载市级要素，市级范围加载区县要素。
      const provinceGeoJsonPath = getProvinceGeoJsonPath(taskData.province);
      const provinceGeoJson = await loadGeoJson(provinceGeoJsonPath);
      const provinceBoundaries = renderFeatureCollection(
        map,
        provinceGeoJson,
        () => provincePolyStyle,
        (feature) => {
          const properties = feature.properties || {};
          const featureLevel = String(properties.level || "");
          if (taskData.province.level === "province") {
            return featureLevel === "city" || featureLevel === "district";
          }
          return featureLevel === "district";
        }
      );

      // 从 GeoJSON 获取当前 province 的边界（用于 SVG 遮罩）
      const provinceMaskBoundaries =
        provinceGeoJson && Array.isArray(provinceGeoJson.features)
          ? provinceGeoJson.features.flatMap((feature) => normalizePolygonPaths(feature.geometry))
          : [];

      // 当前层级的基础边界已由 provinceGeoJson 的所有要素提供
      const cityBoundaries =
        provinceGeoJson && Array.isArray(provinceGeoJson.features)
          ? provinceGeoJson.features.flatMap((feature) => normalizePolygonPaths(feature.geometry))
          : [];

      // 从 GeoJSON 获取高亮区域的边界（确保精确匹配）
      let highlightBoundaries = [];

      if (provinceGeoJson && Array.isArray(provinceGeoJson.features)) {
        highlightBoundaries = collectFeatureRings(
          provinceGeoJson,
          (feature, properties) => regionAdcodes.has(String(properties.adcode || ""))
        );
      }

      // 如果 GeoJSON 中没有找到，尝试加载市级 GeoJSON
      if (highlightBoundaries.length === 0) {
        const cityGeoJsonPaths = Array.from(new Set(
          taskData.regions.map((region) =>
            "/geojson/city/" + (
              String(region.adcode || "").endsWith("00")
                ? String(region.adcode || "")
                : getCityAdcode(region.adcode)
            ) + ".json"
          )
        ));
        const cityGeoJsonMap = await loadGeoJsonEntries(cityGeoJsonPaths);
        for (const region of taskData.regions) {
          const cityAdcode = String(region.adcode || "").endsWith("00")
            ? String(region.adcode || "")
            : getCityAdcode(region.adcode);
          const cityGeoJsonPath = "/geojson/city/" + cityAdcode + ".json";
          const cityGeoJson = cityGeoJsonMap.get(cityGeoJsonPath);
          if (cityGeoJson && Array.isArray(cityGeoJson.features)) {
            highlightBoundaries.push(...collectFeatureRings(
              cityGeoJson,
              (feature, properties) => String(properties.adcode || "") === String(region.adcode || "")
            ));
          }
        }
      }

      const detailLayerSpecs = getProvinceDetailLayerSpecs(taskData.province);

      const regionBoundaries = renderFeatureCollection(
        map,
        provinceGeoJson,
        () => highlightPolyStyle,
        (feature, properties) => regionAdcodes.has(String(properties.adcode || ""))
      );

      for (const region of taskData.regions) {
        if (region.center) {
          continue;
        }
        const feature = findFeatureByAdcode(provinceGeoJson, region.adcode);
        if (feature) {
          const center = getFeatureCenterFromGeometry(feature);
          if (center) {
            region.center = center;
          }
        }
      }

      const markers = taskData.regions.filter((region) => region.center).map((region) => {
        const marker = new AMap.Marker({
          position: region.center,
          offset: new AMap.Pixel(0, 0),
          content: '<div style="width:1px;height:1px;"></div>',
          title: region.name || region.adcode,
          zIndex: 1,
        });
        marker.setMap(map);
        return {
          marker,
          position: region.center,
          value: region.value,
        };
      });

      if (provinceBoundaries.length) {
        const padding = getProvinceFitPadding(taskData.province);
        map.setFitView(
          [
            ...provinceBoundaries,
            ...markers.map((item) => item.marker),
          ],
          false,
          padding
        );
        
        const selectRegionAt = async (lnglat, options = {}) => {
          if (!lnglat) {
            return;
          }
          const requestId = ++hoverRequestId;
          const region = await resolveHoveredRegion(map, provinceGeoJson, lnglat);
          if (requestId !== hoverRequestId) {
            return;
          }
          if (!region) {
            if (options.clearOnMiss !== false) {
              clearSelectedRegion(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries);
            }
            return;
          }
          if (hasSameSelectedRegion(region)) {
            return;
          }
          selectedRegion = region;
          renderSelectedPolygons(map, region.rings);
          renderProvinceLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries);
          renderSelectionCard(map);
        };

        // 设置悬停事件处理
        handleRegionHover = async (event) => {
          const lnglat = event && event.lnglat ? event.lnglat : getDomEventLngLat(map, event);
          if (!lnglat) {
            clearSelectedRegion(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries);
            return;
          }
          await selectRegionAt(lnglat);
        };
        const handleRegionTap = async (event) => {
          const lnglat = event && event.lnglat ? event.lnglat : getDomEventLngLat(map, event);
          if (!lnglat) {
            return;
          }
          await selectRegionAt(lnglat);
        };

        // 监听地图悬停事件
        map.on("mousemove", handleRegionHover);
        
        // 监听容器悬停事件
        map.getContainer().addEventListener("mousemove", (event) => {
          if (typeof handleRegionHover !== "function") {
            return;
          }
          const lnglat = getDomEventLngLat(map, event);
          if (!lnglat) {
            return;
          }
          handleRegionHover({ lnglat });
        }, true);
        map.getContainer().addEventListener("mouseleave", () => {
          clearSelectedRegion(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries);
        });
        map.on("click", handleRegionTap);
        bindTouchTap(map.getContainer(), handleRegionTap);

        window.addEventListener("resize", () => {
          markMapInteracting(() => {
            scheduleDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs);
          });
          scheduleDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs);
        });

        await waitForMapFrame();
        
        window.setTimeout(() => {
          renderDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs, { finishBoot: true });
        }, 260);
        
        map.on("mapmove", () => {
          markMapInteracting(() => {
            scheduleDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs);
          });
          scheduleDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs);
        });
        
        map.on("zoomchange", () => {
          markMapInteracting(() => {
            scheduleDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs);
          });
          scheduleDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs);
        });
      } else if (markers.length === 1) {
        map.setZoomAndCenter(getSingleRegionZoom(taskData.regions[0]), markers[0].marker.getPosition());
      } else {
        map.setFitView(
          [
            ...regionBoundaries,
            ...markers.map((item) => item.marker),
          ],
          false,
          [{{ multi_fitview_padding }}],
          10
        );
      }

      map.on("complete", () => {
        window.setTimeout(() => {
          renderDynamicLayers(map, provinceMaskBoundaries, highlightBoundaries, cityBoundaries, detailLayerSpecs);
          window.__MAP_READY__ = true;
        }, {{ map_complete_delay_ms }});
      });
    }

    init().catch((error) => {
      console.error("Province map render failed", error);
      document.body.innerHTML = '<pre style="padding:16px;color:#b00020;">' + escapeHtml(error.message) + '</pre>';
      window.__MAP_READY__ = true;
    });
  </script>
</body>
</html>
